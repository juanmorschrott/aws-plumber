[project]
name = "aws-plumber"
version = "0.1.0"
description = "A Python CLI toolbox for automating emergency and outage recovery workflows on AWS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.9",
    "click>=8.4.0",
    "readchar>=4.2.2",
    "rich>=15.0.0",
]

[project.scripts]
aws-plumber = "aws_plumber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
